  --uikit-font-displayM-fontSize: 60px;
  --uikit-font-displayM-lineHeight: 60px;
  --uikit-font-displayM-fontWeight: 500;
  --uikit-font-displayM-letterSpacing: -0.16px;

  --uikit-font-displayL-fontFamily: var(--uikit-font-fontFamily-display);
  --uikit-font-displayL-fontSize: 80px;
  --uikit-font-displayL-lineHeight: 80px;
  --uikit-font-displayL-fontWeight: 500;
  --uikit-font-displayL-letterSpacing: -0.16px;
}


/* Шкала рейтинга — как на экране отзывов в приложении: 5 жёлтый … 1 красный.
   Для 3 и 2 звёзд в UI-kit нет токенов, поэтому они заданы здесь. */
:root{
  --star-5:var(--uikit-color-accentYellow);
  --star-4:#f99400;
  --star-3:#f56f24;
  --star-2:#f5503a;
  --star-1:var(--uikit-color-accentRed);
  /* совместимость с кодом дашборда */
  --bg:var(--uikit-color-backgroundSecondary);--panel:var(--uikit-color-backgroundPrimary);
  --ink:var(--uikit-color-textPrimary);--muted:var(--uikit-color-textSecondary);--hint:var(--uikit-color-textHint);
  --line:var(--uikit-color-borderSecondary);--soft:var(--uikit-color-controlSecondary);
  --brand:var(--uikit-color-controlPrimaryBrand);--brand-ink:var(--uikit-color-textInvertedPrimary);
  --pos:var(--uikit-color-successText);--neg:var(--uikit-color-errorText);
  --pos-bg:var(--uikit-color-successBackground);--neg-bg:var(--uikit-color-errorBackground);
  --warn-bg:var(--uikit-color-warningBackground);--warn:var(--uikit-color-warningText);
  --s1:var(--star-1);--s2:var(--star-2);--s3:var(--star-3);--s4:var(--star-4);--s5:var(--star-5);
  --spec:var(--uikit-color-textPrimary);--profi:var(--uikit-color-accentRed);
  --display:var(--uikit-font-fontFamily-display);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--uikit-font-fontFamily);
  font-size:var(--uikit-font-bodyM-fontSize);line-height:var(--uikit-font-bodyM-lineHeight);letter-spacing:var(--uikit-font-bodyM-letterSpacing);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--uikit-color-accentBlue);outline-offset:2px}
h1,h2,h3{margin:0}
svg{flex:none;display:block}
a{color:inherit}

/* ---------- шапка */
.hero{background:var(--panel);border-radius:0 0 var(--uikit-radius-xxl) var(--uikit-radius-xxl);box-shadow:var(--uikit-shadow-s)}
.hero-in{max-width:1880px;margin:0 auto;padding:22px 32px 26px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.brandline{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--muted);font-size:var(--uikit-font-bodyS-fontSize);line-height:var(--uikit-font-bodyS-lineHeight)}
.wordmark{font-family:var(--display);font-weight:500;font-size:20px;line-height:24px;color:var(--ink);letter-spacing:-.2px}
.wordmark i{font-style:normal;color:var(--brand)}
.hero h1{font-family:var(--display);font-weight:500;font-size:var(--uikit-font-displayS-fontSize);line-height:var(--uikit-font-displayS-lineHeight);letter-spacing:var(--uikit-font-displayS-letterSpacing)}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero-meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.meta-chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:6px 12px;border-radius:var(--uikit-radius-xs);background:var(--soft);font-size:var(--uikit-font-bodyS-fontSize);line-height:var(--uikit-font-bodyS-lineHeight);color:var(--ink)}
.meta-chip svg{color:var(--muted)}

/* ---------- липкая панель: вкладки и фильтры */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 1px 0 var(--line),0 8px 16px -12px rgb(24,24,24,.18)}
.bar-in{max-width:1880px;margin:0 auto;padding:14px 32px 12px}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:var(--uikit-radius-s);
  background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;
  font-size:var(--uikit-font-controlM-fontSize);line-height:var(--uikit-font-controlM-lineHeight);font-weight:var(--uikit-font-controlM-fontWeight);
  transition:background-color var(--uikit-transition-stateChange-duration) var(--uikit-transition-stateChange-function)}
nav.tabs button svg{color:var(--muted)}
nav.tabs button:hover{background:var(--uikit-color-controlSecondaryHover)}
nav.tabs button[aria-selected="true"]{background:var(--uikit-color-controlPrimary);color:var(--uikit-color-textInvertedPrimary)}
nav.tabs button[aria-selected="true"] svg{color:var(--uikit-color-textInvertedPrimary)}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:2px}
.fwrap{position:relative}
.pill{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:6px 10px 6px 12px;border:1px solid var(--uikit-color-borderPrimary);border-radius:var(--uikit-radius-xs);
  background:var(--panel);cursor:pointer;white-space:nowrap;
  font-size:var(--uikit-font-bodyS-fontSize);line-height:var(--uikit-font-bodyS-lineHeight);
  transition:background-color var(--uikit-transition-stateChange-duration) var(--uikit-transition-stateChange-function)}
.pill:hover{border-color:var(--uikit-color-decorMono2);background:var(--panel)}
.pill[aria-expanded="true"]{border-color:var(--uikit-color-controlPrimary);box-shadow:0 0 0 1px var(--uikit-color-controlPrimary)}
.pill .k{color:var(--muted)}
.pill .v{font-weight:var(--uikit-font-body-weight-semibold)}
.pill .chev{display:inline-flex;color:var(--muted);transition:transform var(--uikit-transition-stateChange-duration)}
.pill[aria-expanded="true"] .chev{transform:rotate(180deg)}
.pill.on{background:var(--uikit-color-controlPrimary);border-color:var(--uikit-color-controlPrimary);color:var(--uikit-color-textInvertedPrimary)}
.pill.on .k,.pill.on .chev{color:var(--uikit-color-textInvertedSecondary)}
.pill.on:hover{background:var(--uikit-color-controlPrimaryHover)}
.pill.dis{cursor:default;border-style:dashed;background:transparent;color:var(--uikit-color-textDisabled)}
.pill.dis .k{color:var(--uikit-color-textDisabled)}
.pop{position:absolute;top:calc(100% + 8px);left:0;z-index:30;min-width:260px;max-height:420px;overflow:auto;padding:8px;
  background:var(--panel);border-radius:var(--uikit-radius-m);box-shadow:var(--uikit-shadow-m),0 0 0 1px var(--line)}
.pop label{display:flex;gap:12px;align-items:center;min-height:46px;padding:10px 12px;border-radius:var(--uikit-radius-s);cursor:pointer;
  transition:background-color var(--uikit-transition-stateChange-duration)}
.pop label:hover{background:var(--uikit-color-controlTertiaryHover)}
.pop label:has(input:checked){background:var(--uikit-color-controlTertiaryPressed)}
.pop input[type=radio],.pop input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;flex:none;display:grid;place-items:center;
  background:var(--uikit-color-controlSecondary);cursor:pointer;transition:background-color var(--uikit-transition-stateChange-duration)}
.pop input[type=radio]{border-radius:var(--uikit-radius-full)}
.pop input[type=checkbox]{border-radius:6px}
.pop input:checked{background:var(--uikit-color-controlPrimary)}
.pop input[type=radio]:checked::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--uikit-color-decorMono6)}
.pop input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--uikit-color-decorMono6);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.pop .n{margin-left:auto;color:var(--hint);font-size:var(--uikit-font-caption-fontSize)}
.pop .search{width:100%;height:40px;border:0;border-radius:var(--uikit-radius-s);padding:0 12px;margin:0 0 6px;background:var(--uikit-color-backgroundSecondary)}
.pop .sub{font-size:var(--uikit-font-caption-fontSize);line-height:var(--uikit-font-caption-lineHeight);color:var(--muted);padding:10px 12px 4px}
.pop .row{display:flex;gap:8px;align-items:center;padding:4px 12px}
.pop .row input[type=date],.pop .row input[type=number]{flex:1;min-width:0;height:40px;border:0;border-radius:var(--uikit-radius-s);padding:0 10px;background:var(--uikit-color-backgroundSecondary)}
.pop .row span{color:var(--muted)}
.pop .presets{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 8px}
.pop .presets button{height:32px;padding:0 12px;border:0;border-radius:var(--uikit-radius-xs);background:var(--uikit-color-controlSecondary);cursor:pointer;font-size:var(--uikit-font-controlS-fontSize);font-weight:var(--uikit-font-controlS-fontWeight)}
.pop .presets button:hover{background:var(--uikit-color-controlSecondaryHover)}
.pop .apply{margin:8px 12px 4px;width:calc(100% - 24px);justify-content:center}
.pop .poptools{display:flex;justify-content:space-between;padding:10px 12px 4px;border-top:1px solid var(--line);margin-top:6px}
.link{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--muted);font-size:var(--uikit-font-controlS-fontSize);font-weight:var(--uikit-font-controlS-fontWeight);display:inline-flex;gap:6px;align-items:center}
.link:hover{color:#646479}
.fbar>.link{margin-left:6px}

/* ---------- контент */
main{max-width:1880px;margin:0 auto;padding:20px 32px 72px}
.sec{margin-bottom:40px}
.sechead{display:flex;align-items:center;gap:12px 16px;margin-bottom:16px;flex-wrap:wrap}
.sechead h2{font-family:var(--display);font-weight:500;font-size:var(--uikit-font-headlineM-fontSize);line-height:var(--uikit-font-headlineM-lineHeight);letter-spacing:var(--uikit-font-headlineM-letterSpacing)}
.hint{color:var(--muted);font-size:var(--uikit-font-bodyS-fontSize);line-height:var(--uikit-font-bodyS-lineHeight)}
p.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;margin:0 0 16px!important;border-radius:var(--uikit-radius-m);background:var(--panel);color:var(--ink);max-width:none}
p.hint::before{content:"";flex:none;width:16px;height:16px;margin-top:0;background:var(--muted);
  -webkit-mask:var(--ic-info) center/16px no-repeat;mask:var(--ic-info) center/16px no-repeat}
.panel{background:var(--panel);border-radius:var(--uikit-radius-xl);padding:24px;box-shadow:var(--uikit-shadow-s)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--uikit-radius-xxs);background:var(--uikit-color-accentBlueBackground);color:var(--uikit-color-accentBlueText);font-size:var(--uikit-font-caption-fontSize);font-weight:var(--uikit-font-caption-weight-semibold)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);background:var(--bg);border-radius:var(--uikit-radius-m)}
.warnplate{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:var(--uikit-radius-xxs);background:var(--warn-bg);color:var(--warn);
  font-size:var(--uikit-font-caption-fontSize);line-height:var(--uikit-font-caption-lineHeight);font-weight:var(--uikit-font-caption-weight-semibold);white-space:nowrap}

/* ---------- карточка оценки */
.kpi .kh{display:flex;gap:12px;align-items:center}
.kicon{width:48px;height:48px;border-radius:var(--uikit-radius-s);display:grid;place-items:center;background:var(--bg);color:var(--ink);flex:none}
.kpi.profi .kicon{background:var(--uikit-color-accentRedBackground);color:var(--brand)}
.kpi h3{font-size:var(--uikit-font-titleL-fontSize);line-height:var(--uikit-font-titleL-lineHeight);font-weight:var(--uikit-font-titleL-fontWeight);letter-spacing:var(--uikit-font-titleL-letterSpacing)}
.kpi .q{color:var(--muted);font-size:var(--uikit-font-bodyS-fontSize);line-height:var(--uikit-font-bodyS-lineHeight);margin-top:2px}
.kpibody{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:24px 0 20px}
.kbig{display:flex;align-items:flex-end;gap:12px}
.kmean{font-family:var(--display);font-weight:500;font-size:var(--uikit-font-displayM-fontSize);line-height:var(--uikit-font-displayM-lineHeight);letter-spacing:-.5px}
.kstarbig{color:var(--star-5);margin-bottom:8px}
.kstarbig svg{width:32px;height:32px}
.klabel{color:var(--muted);font-size:var(--uikit-font-bodyS-fontSize);line-height:var(--uikit-font-bodyS-lineHeight);margin-bottom:8px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kp{display:flex;flex-direction:column;gap:2px;min-width:118px;padding:12px 14px;border-radius:var(--uikit-radius-m);background:var(--bg)}
.kp b{font-family:var(--display);font-weight:500;font-size:var(--uikit-font-headlineS-fontSize);line-height:var(--uikit-font-headlineS-lineHeight)}
.kp span{color:var(--muted);font-size:var(--uikit-font-caption-fontSize);line-height:var(--uikit-font-caption-lineHeight)}
.kp.pos{background:var(--pos-bg)}.kp.pos b{color:var(--pos)}
.kp.neg{background:var(--neg-bg)}.kp.neg b{color:var(--neg)}
.rating{display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) 56px 44px;gap:14px;align-items:center}
.stars{display:flex;gap:2px}
.stars svg{width:18px;height:18px}
.stars .off{color:var(--uikit-color-decorMono5)}
.rtrack{height:6px;border-radius:3px;background:var(--uikit-color-decorMono4);overflow:hidden}
.rtrack div{height:100%;border-radius:3px}
.rpct{text-align:right;font-weight:var(--uikit-font-body-weight-semibold)}
.rn{text-align:right;color:var(--hint);font-size:var(--uikit-font-bodyS-fontSize)}
.kpi .warnplate{margin-top:14px}

/* ---------- переключатели */
.seg,.vtabs{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:var(--uikit-radius-s);background:var(--uikit-color-controlSecondary)}
.seg button,.vtabs button{height:32px;padding:0 12px;border:0;border-radius:var(--uikit-radius-xs);background:transparent;cursor:pointer;white-space:nowrap;
  font-size:var(--uikit-font-controlS-fontSize);line-height:var(--uikit-font-controlS-lineHeight);font-weight:var(--uikit-font-controlS-fontWeight);
  transition:background-color var(--uikit-transition-stateChange-duration)}
.seg button:hover,.vtabs button:hover{background:var(--uikit-color-controlTertiaryHover)}
.seg button[aria-pressed="true"],.vtabs button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 4px rgb(24,24,24,.08)}
.vtabs button[aria-pressed="true"]{background:var(--uikit-color-controlPrimaryBrand);color:var(--uikit-color-textInvertedPrimary);box-shadow:none}

/* ---------- причины */
.fhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.fhead h3{display:flex;align-items:center;gap:8px;font-size:var(--uikit-font-titleL-fontSize);line-height:var(--uikit-font-titleL-lineHeight);font-weight:600;letter-spacing:var(--uikit-font-titleL-letterSpacing)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:12px;align-items:end}
.bar .t{margin-bottom:6px}
.bar .track,.stack{height:8px;border-radius:4px;background:var(--uikit-color-controlSecondary);overflow:hidden;display:flex}
.bar .fill{height:100%;border-radius:4px}
.bar .v{text-align:right;font-weight:var(--uikit-font-body-weight-semibold)}
.bar.zero .t,.bar.zero .v{color:var(--hint);font-weight:400}
.bar.other .t{color:var(--muted)}
.basen{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:var(--uikit-font-bodyS-fontSize);line-height:var(--uikit-font-bodyS-lineHeight)}

/* ---------- кнопки */
.btnrow{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;border-radius:var(--uikit-radius-s);cursor:pointer;
  background:var(--panel);color:var(--ink);font-size:var(--uikit-font-controlM-fontSize);line-height:var(--uikit-font-controlM-lineHeight);font-weight:var(--uikit-font-controlM-fontWeight);
  transition:background-color var(--uikit-transition-stateChange-duration) var(--uikit-transition-stateChange-function)}
.btn:hover{background:var(--uikit-color-controlSecondaryHover)}
.btn.primary{background:var(--uikit-color-controlPrimaryBrand);color:var(--uikit-color-textInvertedPrimary)}
.btn.primary:hover{background:var(--uikit-color-controlPrimaryBrandHover)}
.btn.primary:active{background:var(--uikit-color-controlPrimaryBrandPressed)}

/* ---------- открытые ответы */
details.oa{background:var(--panel);border-radius:var(--uikit-radius-l);margin-bottom:8px;box-shadow:var(--uikit-shadow-s);overflow:hidden}
details.oa summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;gap:12px;align-items:center;font-weight:var(--uikit-font-body-weight-semibold)}
details.oa summary::-webkit-details-marker{display:none}
details.oa summary .oic{width:32px;height:32px;border-radius:var(--uikit-radius-xs);display:grid;place-items:center;background:var(--bg);color:var(--muted);flex:none}
details.oa summary .cnt{margin-left:auto;display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:400;white-space:nowrap}
details.oa summary .cnt::after{content:"";width:16px;height:16px;background:currentColor;-webkit-mask:var(--ic-chev) center/16px no-repeat;mask:var(--ic-chev) center/16px no-repeat;transition:transform var(--uikit-transition-stateChange-duration)}
details.oa[open] summary .cnt::after{transform:rotate(180deg)}
details.oa[open] summary{border-bottom:1px solid var(--line)}
.oascroll{max-height:420px;overflow:auto}
.sc{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 8px 0 6px;border-radius:var(--uikit-radius-xxs);font-weight:600;font-size:var(--uikit-font-bodyS-fontSize)}
.sc svg{width:14px;height:14px}
.sc5{background:var(--uikit-color-accentYellowBackground);color:#b36b00}.sc5 svg{color:var(--star-5)}
.sc4{background:var(--uikit-color-warningBackground);color:#b36100}.sc4 svg{color:var(--star-4)}
.sc3,.sc2,.sc1{background:var(--uikit-color-errorBackground);color:var(--uikit-color-errorText)}
.sc3 svg{color:var(--star-3)}.sc2 svg{color:var(--star-2)}.sc1 svg{color:var(--star-1)}
.olink{display:inline-flex;align-items:center;gap:4px;color:var(--uikit-color-accentRedText);text-decoration:none;font-weight:var(--uikit-font-body-weight-semibold);white-space:nowrap}
.olink:hover{color:#e6213e;text-decoration:underline;text-underline-offset:3px}
.olink svg{width:14px;height:14px}

/* ---------- таблицы */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--uikit-font-bodyS-fontSize);line-height:var(--uikit-font-bodyS-lineHeight)}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:400;white-space:nowrap;background:var(--panel);position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgb(169,169,193,4%)}
td.txt{min-width:280px;max-width:480px;font-size:var(--uikit-font-bodyM-fontSize);line-height:var(--uikit-font-bodyM-lineHeight-paragraph)}
.nw td,.nw th{white-space:nowrap}
.panel>.tablewrap:first-child,.panel[style*="padding:0"]{overflow:hidden}

/* значимость в динамике */
.c{display:inline-flex;align-items:center;justify-content:center;min-width:96px;height:28px;padding:0 10px;border-radius:var(--uikit-radius-xs);font-weight:600}
.c-up{background:var(--pos-bg);color:var(--pos)}
.c-down{background:var(--neg-bg);color:var(--neg)}
.c-ns{color:var(--muted);font-weight:400}
.c-low{background:var(--warn-bg);color:var(--warn);font-weight:600}
.c-ref{color:var(--hint);font-size:var(--uikit-font-caption-fontSize)}
.clegend,.bleg{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin:0 0 16px;color:var(--muted);font-size:var(--uikit-font-bodyS-fontSize)}
.clegend .c{min-width:0;height:24px;font-size:var(--uikit-font-caption-fontSize)}
.bleg span{display:inline-flex;align-items:center;gap:8px}
.bleg i{display:inline-block;width:20px;height:20px;border-radius:6px}
.arrow{color:var(--hint)}
.mini{display:inline-block;height:6px;border-radius:3px;background:var(--pos);vertical-align:middle;margin-right:8px}
select{height:40px;padding:0 36px 0 14px;border:0;border-radius:var(--uikit-radius-s);background:var(--panel) var(--ic-chev-url) no-repeat right 12px center;appearance:none;-webkit-appearance:none;cursor:pointer;font-weight:var(--uikit-font-body-weight-semibold)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls label{color:var(--muted);font-size:var(--uikit-font-bodyS-fontSize)}
.controls input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border-radius:6px;display:grid;place-items:center;background:var(--uikit-color-controlSecondary);cursor:pointer;transition:background-color var(--uikit-transition-stateChange-duration)}
.controls input[type=checkbox]:hover{background:var(--uikit-color-controlSecondaryHover)}
.controls input[type=checkbox]:checked{background:var(--uikit-color-controlPrimary)}
.controls input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--uikit-color-decorMono6);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.controls label:has(input[type=checkbox]){color:var(--ink);font-size:var(--uikit-font-bodyM-fontSize)}

/* ---------- баннер сравнений */
.dimchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.dimchips .lbl{color:var(--muted);font-size:var(--uikit-font-bodyS-fontSize);margin-right:4px}
.dimchips button{height:32px;padding:0 12px;border:0;border-radius:var(--uikit-radius-xs);background:var(--panel);cursor:pointer;font-size:var(--uikit-font-controlS-fontSize);font-weight:var(--uikit-font-controlS-fontWeight);transition:background-color var(--uikit-transition-stateChange-duration)}
.dimchips button:hover{background:var(--uikit-color-controlSecondaryHover)}
.dimchips button[aria-pressed="true"]{background:var(--uikit-color-controlPrimary);color:var(--uikit-color-textInvertedPrimary)}
.lhelp{position:relative;display:inline-flex;align-items:center;gap:6px;cursor:help;outline:none}
.lhelp .q{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--soft);color:var(--muted);font-style:normal;font-size:11px;font-weight:700;margin-left:2px}
.lhelp:hover .q,.lhelp:focus .q{background:var(--ink);color:var(--panel)}
.lhelp .tipbox{display:none;position:absolute;top:calc(100% + 8px);left:0;width:360px;z-index:30;background:var(--panel);color:var(--ink);border-radius:var(--uikit-radius-m);box-shadow:0 8px 32px rgb(24,24,24,.16);padding:14px 16px;font-size:var(--uikit-font-bodyS-fontSize);line-height:1.45;white-space:normal}
.lhelp:hover .tipbox,.lhelp:focus .tipbox{display:block}
.lhelp .tipbox>b{display:block;margin-bottom:8px}
.lhelp .ex{display:block;margin:0 0 10px;border:1px solid var(--line);border-radius:var(--uikit-radius-s);overflow:hidden}
.lhelp .ex table{border-collapse:collapse;width:100%;font-size:12px}
.lhelp .ex td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
.lhelp .ex tr:last-child td{border-bottom:0}
.lhelp .ex tr:first-child td{color:var(--muted);font-weight:600}
.lhelp .ex td:first-child{text-align:left;color:var(--muted)}
.lhelp .ex em{display:block;font-style:normal;font-weight:400;color:var(--hint);font-size:11px}
.lhelp .ex .hl{background:var(--pos-bg);color:var(--pos);padding:2px 6px;border-radius:6px}
.lhelp sup{font-size:10px;font-weight:700}
#ctip{display:none;position:fixed;z-index:50;pointer-events:none;max-width:320px;background:var(--uikit-color-textPrimary);color:#fff;border-radius:var(--uikit-radius-s);padding:8px 12px;font-size:12px;line-height:1.45;box-shadow:0 6px 24px rgb(24,24,24,.2)}
.glg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 12px;font-size:var(--uikit-font-bodyS-fontSize)}
.glg span{display:inline-flex;align-items:center;gap:6px}
.glg i{width:10px;height:10px;border-radius:50%}
.glg em{font-style:normal;color:var(--hint)}
.gchart{margin-bottom:8px}
.gtwo{align-items:stretch}
.gpanel{display:flex;flex-direction:column}
.gpanel .basen{margin-top:auto;padding-top:12px}
.gnote{height:28px;display:flex;align-items:center;margin:-4px 0 8px;font-size:12px}
.gtip{width:420px}
.gtip .gsep{display:block;height:8px}
.sechead .lhelp{margin-left:-4px}
.sechead .lhelp .q{width:20px;height:20px;font-size:12px}
.grow{display:grid;grid-template-columns:260px 1fr 64px;gap:16px;align-items:center;height:36px;border-radius:6px;padding-right:4px}
.grow:not(.gaxis):hover{background:var(--bg)}
.glab{font-size:13px;color:var(--ink);line-height:1.25;text-align:right}
.glab span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gtrk{position:relative;height:20px}
.gtrk>i{position:absolute;top:-5px;bottom:-5px;border-left:1px solid var(--line)}
.gaxis .gtrk span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--hint);top:2px}
.grow.gaxis{height:22px}
.gline{position:absolute;top:8px;height:4px;border-radius:2px;opacity:.3}
.gline.neg{background:var(--uikit-color-accentRed)}.gline.mid{background:var(--star-4)}
.gdot{position:absolute;top:3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--panel);box-sizing:border-box}
.gdot.mid{background:var(--star-4)}.gdot.neg{background:var(--uikit-color-accentRed)}
.gd{font-size:12px;color:var(--hint);text-align:right;white-space:nowrap}
.grow.gsig .glab,.grow.gsig .gd{font-weight:700;color:var(--ink)}
.grow.gsig .gline{opacity:.75}
.grow.gother .glab{color:var(--muted)}
.oa td.txt{min-width:460px;max-width:720px;line-height:1.45}
.oahead{display:flex;align-items:baseline;gap:12px;margin:24px 0 12px}
.oahead:first-of-type{margin-top:8px}
.oahead h3{display:flex;align-items:center;gap:8px;font-size:17px;margin:0}
.meta-chip.mc2{flex-direction:column;align-items:flex-start;gap:0;min-height:0;padding:4px 10px;font-size:12px;line-height:16px}
.meta-chip .mlab{color:var(--hint);font-size:10px;line-height:12px;text-transform:uppercase;letter-spacing:.04em}
.lhelp.hl2{font-size:var(--uikit-font-bodyS-fontSize);color:var(--muted);margin-left:4px}
.lhelp.hl2:hover,.lhelp.hl2:focus{color:var(--ink)}
.gex{display:block;margin:10px 0;padding:8px 10px;border:1px solid var(--line);border-radius:var(--uikit-radius-s)}
.gexr{display:grid;grid-template-columns:96px 1fr 56px;gap:8px;align-items:center;height:26px}
.gexl{font-size:12px;text-align:right}
.gext{position:relative;height:20px;display:block}
.gexd{font-size:12px;color:var(--muted);text-align:right}
.gli{display:flex;align-items:center;gap:8px;font-size:12px;margin:2px 0}
.gli i{width:10px;height:10px;border-radius:50%;flex:none}
.bt{border-collapse:separate;border-spacing:0}
.bt th,.bt td{text-align:center;white-space:nowrap;padding:11px 12px}
.bt th:first-child,.bt td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:2;min-width:180px;border-right:1px solid var(--line)}
.bt thead th{vertical-align:bottom;z-index:3}
.bt thead th:first-child{z-index:4}
.bt .grp th{font-size:var(--uikit-font-caption-fontSize);color:var(--hint);border-bottom:0;padding-bottom:0}
.bt th.blk,.bt td.blk{border-left:1px solid var(--line)}
.bt .colh{color:var(--ink);font-weight:600}
.bt .colh .let{display:block;margin-top:2px;color:var(--hint);font-weight:400;font-size:var(--uikit-font-caption-fontSize)}
.bt .colh.low{color:var(--warn)}
.bt .sect td{background:var(--bg);font-weight:600;text-align:left;border-bottom:0}
.bt .sect td:first-child{background:var(--bg)}
.bt .sect td .sw{margin-right:8px;vertical-align:0}
.bt .rsect td{background:var(--panel);font-weight:600;padding-top:18px;border-top:1px solid var(--line)}
.bt .rsect td:first-child{background:var(--panel)}
.bt .rwho{margin-left:8px;color:var(--hint);font-weight:400;font-size:var(--uikit-font-caption-fontSize)}
.bt td.tot{background:var(--bg);font-weight:600}
.bt td.v{min-width:84px}
.bt td.up{background:var(--pos-bg);color:var(--pos);font-weight:600}
.bt td.down{background:var(--neg-bg);color:var(--neg);font-weight:600}
.bt td.lowc{color:var(--hint);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--bg) 6px 12px)}
.bt sup{font-size:10px;font-weight:700;color:var(--ink);margin-left:3px;letter-spacing:.5px}
.bt tr.base td{color:var(--muted)}
.bt tr.sub td:first-child{padding-left:28px;color:var(--muted)}

/* ---------- график динамики */
.chart svg{width:100%;height:auto}
.chart text{font-family:var(--uikit-font-fontFamily)}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:var(--uikit-font-bodyS-fontSize)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- как читать */
.rdwrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
.rdtoc{position:sticky;top:224px;display:flex;flex-direction:column;gap:2px;padding-right:16px;border-right:1px solid var(--line)}
.rdtoc a{padding:8px 10px;border-radius:var(--uikit-radius-xs);color:var(--muted);text-decoration:none;font-size:var(--uikit-font-bodyS-fontSize);line-height:var(--uikit-font-bodyS-lineHeight)}
.rdtoc a:hover{background:var(--bg);color:var(--ink)}
.rd{margin-bottom:36px;scroll-margin-top:230px}
.rd h3{font-family:var(--display);font-weight:500;font-size:var(--uikit-font-headlineS-fontSize);line-height:var(--uikit-font-headlineS-lineHeight);margin-bottom:12px}
.rd p,.rd li{max-width:82ch;font-size:var(--uikit-font-bodyM-fontSize);line-height:var(--uikit-font-bodyM-lineHeight-paragraph)}
.rd ul{padding-left:20px;margin:8px 0}
.rd li{margin-bottom:8px}
.rd li::marker{color:var(--brand)}
.rdt{margin:12px 0 16px;border-radius:var(--uikit-radius-m);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.rdt th{background:var(--bg)}
.rdt td{vertical-align:top}

/* ---------- тост */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);z-index:50;
  padding:14px 20px;border-radius:var(--uikit-radius-m);background:var(--uikit-color-controlPrimary);color:var(--uikit-color-textInvertedPrimary);
  box-shadow:var(--uikit-shadow-m);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:960px){
  .two,.rdwrap{grid-template-columns:1fr}
  .hero-in,.bar-in,main{padding-left:16px;padding-right:16px}
  .hero h1{font-size:var(--uikit-font-headlineL-fontSize);line-height:var(--uikit-font-headlineL-lineHeight)}
  .hero-meta{margin-left:0}
  .rdtoc{position:static;border-right:0;padding-right:0}
  .rrow{grid-template-columns:auto minmax(0,1fr) 52px}
  .rn{display:none}
}

const DATA={"R":[{"id":"179194405","cid":"46854","oid":"91285983","uid":"A45A95103EB54017B2823918F0E56B86","ts":"2026-09-27 14:38","date":"2026-09-27","vert":"home","plat":"ios","web":null,"place":"closed","first":false,"std":false,"bs":true,"gender":"f","city":"msk","cgr":"Москва","ordN":2,"ord":"1–2","mark":null,"hasrev":true,"src":"order_closed","cat":"mstr","spec":2,"specF":["Плохо сделал","Сделал не всё, о чём договорились","Другое"],"specG":"neg","specO":"Поначалу все было ок. Ребята сделали работу быстро. Но потом оказалось, что главную причину создания заказа не устранили, а именно - кондиционер продолжил течь. Это обнаружилось в общем-то сразу после их работы. Специалисты говорили, что может быть еще остаточная вода, но в итоге со временем протечка так и не прекратилась. \nКроме этого, именно они создали (!) еще одну проблему с кондиционером - после их работы при непогоде слышен стук, достаточно громкий. До них ни разу с момента установки кондея не было никакого стука, а это несколько лет эксплуатации. \nВ дальнейшем я еще раза три их вызывала. Они приезжали и не брали денег, но ни одну из проблем так и не смогли устранить. Кондей продолжает течь постоянно и стучать при непогоде. Стук - это просто худшее, что они могли сделать, тк кондиционер находится в спальном помещении. Я в полнейшем разочаровании. Поставила дополнительную звезду и не стала менять отзыв только потому что они выражают готовность снова приехать, но 4 раза по-моему уже слишком. Я их видеть больше не хочу, проблемы они не могут решить. Это полный кошмар. Руки так и чешутся скорректировать публичный отзыв, но пока остановлюсь на этом. Это ужас!!!!","profi":5,"profiF":["Легко создать задачу","Было из кого выбирать","Легко выбрать из откликов","Понятное приложение","Удобная оплата"],"profiG":"pos","profiO":null,"complete":true,"ctype":"low","kk":"9029275","gap":null},{"id":"179239231","cid":"46854","oid":"94353290","uid":"DA0F8B5913534EA1B124D009DFF2D26B","ts":"2026-09-28 00:37","date":"2026-0 function pass(r,skip=[]){
  const f=S.f;
  if(!skip.includes("period")){const[a,b]=pRange();if(r.d<a||r.d>b)return false}
  if(!skip.includes("vert")&&f.vert!=="all"&&r.vert!==f.vert)return false;
  if(!skip.includes("plat")&&f.plat!=="all"){if(f.plat==="app"){if(r.plat==="web")return false}else if(f.plat==="mweb"||f.plat==="dweb"){if(r.web!==f.plat)return false}else if(r.plat!==f.plat)return false}
  if(!skip.includes("place")&&f.place!=="all"&&r.place!==f.place)return false;
  const tri=(v,val,yes)=>val==="all"?true:val==="na"?v==null:v===(val===yes);
  if(!skip.includes("ctype")&&f.ctype!=="all"&&r.ctype!==f.ctype)return false;
  if(!skip.includes("gapsz")&&f.gapsz!=="all"&&!(r.ctype==="gap"&&(f.gapsz==="1"?r.gap===1:r.gap>=2)))return false;
  if(!skip.includes("first")&&!tri(r.first,f.first,"first"))return false;
  if(!skip.includes("std")&&!tri(r.std,f.std,"std"))return false;
  if(!skip.includes("bs")&&!tri(r.bs,f.bs,"yes"))return false;
  if(!skip.includes("cgr")&&f.cgr.length&&!f.cgr.includes(r.cgr))return false;
  if(!skip.includes("city")&&f.city.length&&!f.city.includes(r.city))return false;
  if(!skip.includes("ord")){
    if(f.ordMin!==""||f.ordMax!==""){if(r.ordN==null)return false;if(f.ordMin!==""&&r.ordN<+f.ordMin)return false;if(f.ordMax!==""&&r.ordN>+f.ordMax)return false}
    else if(f.ord.length&&!f.ord.includes(r.ord))return false}
  if(!skip.includes("gender")&&f.gender!=="all"&&r.gender!==f.gender)return false;
  if(!skip.includes("mark")&&f.mark.length&&!f.mark.includes(r.mark||"Нет оценки"))return false;
  if(f.complete==="full"&&!r.complete)return false;
  return true;
}

/* ================= статистика ================= */
function st(rows,k){
  const v=[];for(const r of rows)if(r[k]!=null)v.push(r[k]);const n=v.length;
  const dist=[0,0,0,0,0];v.forEach(x=>dist[x-1]++);
  const mean=n?v.reduce((a,b)=>a+b,0)/n:0;
  const sd=n>1?Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(n-1)):0;
  return{n,mean,sd,dist,top:n?(dist[3]+dist[4])/n:0,bot:n?(dist[0]+dist[1])/n:0,tc:dist[3]+dist[4],bc:dist[0]+dist[1]};
}
const erf=x=>{const t=1/(1+.3275911*Math.abs(x));const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x>=0?y:-y};
const pz=z=>2*(1-.5*(1+erf(Math.abs(z)/Math.SQRT2)));
/* Методика скилла CES (studio/engine.js, ces_z_frequency_v1), без весов:
   SE = √(Σ(x−m)² / ((n−1)·n)), z = (m₁−m₂) / √(SE₁²+SE₂²), двусторонний, p < 0,05, без поправок.
   Доля = среднее индикатора 0/1, поэтому SE² = p(1−p)/(n−1). Если обе SE = 0 — тест не проводится. */
function zprop(c1,n1,c2,n2){if(n1<2||n2<2)return 1;const p1=c1/n1,p2=c2/n2;const den=Math.sqrt(p1*(1-p1)/(n1-1)+p2*(1-p2)/(n2-1));return den?pz((p1-p2)/den):1}
function tmean(a,b){if(a.n<2||b.n<2)return 1;const den=Math.sqrt(a.sd**2/a.n+b.sd**2/b.n);return den?pz((a.mean-b.mean)/den):1}
const pct=x=>Math.round(x*100)+"%";
const num=x=>x.toFixed(2).replace(".",",");
const pp=x=>{const v=Math.round(x*100);return(v>0?"+":v<0?"−":"±")+Math.abs(v)+" п.п."};
const dm=x=>(x>0?"+":x<0?"−":"±")+Math.abs(x).toFixed(2).replace(".",",");
const small=n=>n<40?`<span class="warnplate">Маленькая база: ${n}</span>`:"";
/* цветная ячейка изменения: better=1 — рост хорошо, -1 — рост плохо */
function cell(p,d,fmt,better,low){
  if(low)return`<span class="c c-low">база &lt; 40</span>`;
  if(p>=.05)return`<span class="c c-ns">${fmt(d)} · н/з</span>`;
  const good=d*better>0;return`<span class="c ${good?"c-up":"c-down"}">${d>0?"▲":"▼"} ${fmt(d)}</span>`;
}

const SC=["--s1","--s2","--s3","--s4","--s5"];
function donut(s,k){
  const r=62,C=2*Math.PI*r;let off=0,segs="";
  for(let i=4;i>=0;i--){const len=s.n?s.dist[i]/s.n*C:0;if(len>0)segs+=`<circle r="${r}" cx="90" cy="90" fill="none" stroke="var(${SC[i]})" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${i+1}: ${pct(s.dist[i]/s.n)}</title></circle>`;off+=len}
  if(!s.n)segs=`<circle r="${r}" cx="90" cy="90" fill="none" stroke="var(--soft)" stroke-width="26"/>`;
  return`<svg class="donut" viewBox="0 0 180 180" role="img" aria-label="Распределение оценок">${segs}
  <text x="90" y="92" text-anchor="middle" font-size="30" font-weight="600" fill="var(--ink)">${s.n?num(s.mean):"—"}</text>
  <text x="90" y="113" text-anchor="middle" font-size="12" fill="var(--muted)">средний балл</text></svg>`;
}
const starsRow=n=>`<span class="stars" aria-label="${n} из 5">${[1,2,3,4,5].map(i=>`<span style="color:${i<=n?`var(--star-${n})`:""}" class="${i<=n?"":"off"}">${IC.star}</span>`).join("")}</span>`;
function kpi(rows,k,title,q){
  const s=st(rows,k);
  const rows5=[5,4,3,2,1].map(sc=>{const c=s.dist[sc-1],sh=s.n?c/s.n:0;
    return`<div class="rrow">${starsRow(sc)}<div class="rtrack"><div style="width:${sh*100}%;background:var(--star-${sc})"></div></div><span class="rpct">${s.n?pct(sh):"—"}</span><span class="rn">${c.toLocaleString("ru")}</span></div>`}).join("");
  return`<div class="panel kpi ${k}"><div class="kh"><span class="kicon">${k==="spec"?IC.user:IC.shine}</span><div><h3>${title}</h3><div class="q">${q}</div></div></div>
  <div class="kpibody"><div class="kbig"><span class="kmean">${s.n?num(s.mean):"—"}</span><span class="kstarbig">${IC.starL}</span><span class="klabel">средний балл<br>${s.n.toLocaleString("ru")} ответов</span></div>
  <div class="kpis"><div class="kp pos"><b>${pct(s.top)}</b><span>top-2 · оценки 4 и 5</span></div><div class="kp neg"><b>${pct(s.bot)}</b><span>bottom-2 · оценки 1 и 2</span></div></div></div>
  <div class="rating">${rows5}</div>${small(s.n)}</div>`;
}
const GL={pos:"Плюсы · оценка 5",mid:"4 · чего не хватило",neg:"1–3 · что пошло не так"};
const GQ={pos:"«Что понравилось?»",mid:"«А чего не хватило до пятёрки?»",neg:"«Что пошло не так?»"};
const GCOL={pos:"var(--uikit-color-accentGreen)",mid:"var(--star-4)",neg:"var(--uikit-color-accentRed)"};
function factors(rows,k,title,vert){
  const g=S.fg[k];
  let h=`<div class="panel"><div class="fhead"><h3><i class="sw" style="background:var(--${k})"></i>${title}</h3><div class="seg" role="group" aria-label="Группа оценок">`;
  for(const x of["pos","mid","neg"])h+=`<button data-fg="${k}" data-v="${x}" aria-pressed="${g===x}">${GL[x]}</button>`;
  h+=`</div></div><div class="hint" style="margin:-4px 0 12px">Вопрос: ${GQ[g]}</div>`;
  const inG=r=>r[k+"G"]===g;
  const sub=rows.filter(r=>inG(r)&&r[k+"F"]);const n=sub.length;
  const cnt={};sub.forEach(r=>r[k+"F"].forEach(f=>cnt[f]=(cnt[f]||0)+1));
  const opts=[...FACT[vert][k][g==="pos"?"pos":"neg"]].sort((a,b)=>(cnt[b]||0)-(cnt[a]||0));opts.push("Другое");
  const col=GCOL[g];
  h+=`<div class="bars">`+opts.map(f=>{const c=cnt[f]||0;return`<div class="bar${c?"":" zero"}${f==="Другое"?" other":""}"><div><div class="t">${f}</div><div class="track"><div class="fill" style="width:${n?c/n*100:0}%;background:${col}"></div></div></div><div class="v">${n?pct(c/n):"—"}</div></div>`}).join("")+`</div>`;
  return h+`<div class="basen">База: ${n} ${small(n)}</div></div>`;
}

/* ---- баннер: тотал + группы, значимость против тотала (группа против остальных) и между группами (буквы) ---- */
const LET="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
function tmeanRest(a,b){return tmean(a,b)}
const BRANCH=[["pos","Что понравилось?","оценка 5",1],["mid","А чего не хватило до пятёрки?","оценка 4",-1],["neg","Что пошло не так?","оценки 1–3",-1]];
function reasonRows(k,t,base,blocks,ncol){
  const cv=S.f.vert!=="all"?S.f.vert:S.cv;
  const inScope=r=>k==="profi"||r.vert===cv;
  let h="";
  for(const[g,q,who,better]of BRANCH){
    const ans=rows=>rows.filter(r=>inScope(r)&&r[k+"G"]===g&&r[k+"F"]);
    const T=ans(base);
    const cols=blocks.map(b=>b.gs.map(x=>({x,a:ans(x.rows)})));
    const opts=[...(k==="profi"?FACT.home.profi:FACT[cv].spec)[g==="pos"?"pos":"neg"],"Другое"];
    const cnt=(rows,o)=>rows.reduce((s,r)=>s+(r[k+"F"].includes(o)?1:0),0);
    const sorted=opts.map(o=>[o,T.length?cnt(T,o)/T.length:0]).sort((a,b)=>(a[0]==="Другое")-(b[0]==="Другое")||b[1]-a[1]);
    const scope=k==="spec"?` · ${LBL[cv]}`:"";
    h+=`<tr class="sect rsect"><td>${t}${scope} · «${q}»<span class="rwho">${who}</span></td><td colspan="${ncol}"></td></tr>`;
    for(const[o]of sorted){
      const tc=cnt(T,o),tn=T.length;
      h+=`<tr class="sub"><td>${o}</td><td class="tot">${tn?pct(tc/tn):"—"}</td>`;
      cols.forEach(bl=>{const st2=bl.map(y=>({n:y.a.length,c:cnt(y.a,o)}));
        st2.forEach((z,i)=>{const cls=[i===0?"blk":""];
          if(!z.n){h+=`<td class="v ${cls.join(" ")}">—</td>`;return}
          const v=z.c/z.n;
          if(z.n<40){h+=`<td class="v lowc ${cls.join(" ")}">${pct(v)}</td>`;return}
          if(tn>=40&&zprop(z.c,z.n,tc,tn)<.05){cls.push((v-tc/tn)*better>0?"up":"down")}
          let lets="",ln=[];st2.forEach((y,j)=>{if(j===i||y.n<40)return;if(v>y.c/y.n&&zprop(z.c,z.n,y.c,y.n)<.05){lets+=bl[j].x.let;ln.push(bl[j].x.n+" ("+bl[j].x.let+")")}});
          h+=`<td class="v ${cls.join(" ")}"${ln.length?` title="Значимо выше, чем: ${ln.join(", ")}"`:""}>${pct(v)}${lets?`<sup>${lets}</sup>`:""}</td>`})});
      h+=`</tr>`;
    }
    h+=`<tr class="base"><td>База: ответили на вопрос</td><td class="tot" style="font-weight:500">${T.length}</td>`;
    cols.forEach(bl=>bl.forEach((y,i)=>{const n=y.a.length;h+=`<td class="${i===0?"blk":""}">${n}${n&&n<40?` <span class="warnplate">мало</span>`:""}</td>`}));
    h+=`</tr>`;
  }
  return h;
}

  <div class="bleg"><span><i style="background:var(--pos-bg);border:1px solid var(--pos)"></i>значимо лучше тотала</span><span><i style="background:var(--neg-bg);border:1px solid var(--neg)"></i>значимо хуже тотала</span><span class="lhelp" tabindex="0"><sup style="font-size:11px;font-weight:700;color:var(--ink)">B</sup>&nbsp;буква — значимо выше колонки с этой буквой<i class="q" aria-hidden="true">?</i><span class="tipbox" role="tooltip"><b>Как читать букву</b>
<span class="ex"><table><tr><td></td><td>Тотал</td><td>Home+<em>A</em></td><td>Репетиторы<em>B</em></td></tr><tr><td>Средний балл</td><td>4,74</td><td><b class="hl">4,79<sup>B</sup></b></td><td>4,68</td></tr></table></span>
У каждой колонки своя буква — она под названием группы. «4,79<sup>B</sup>» в колонке Home+ значит: у Home+ значимо выше, чем у колонки B (Репетиторы). Буквы сравнивают группы только внутри одного разреза. Наведите на ячейку с буквой — подскажем, с кем сравнение.</span></span><span><i style="background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 8px)"></i>база меньше 40, тест не считаем</span></div>
  `;

  /* шапка */
  h+=`<div class="panel" style="padding:0"><div class="tablewrap" style="max-height:70vh;overflow:auto"><table class="bt"><thead>
  <tr class="grp"><th></th><th></th>${blocks.map(b=>`<th class="blk" colspan="${b.gs.length}">${b.l}</th>`).join("")}</tr>
  <tr><th>Метрика</th><th class="colh">Тотал<span class="let">&nbsp;</span></th>${blocks.map(b=>b.gs.map((g,i)=>{const n=g.rows.length;return`<th class="colh${n<40?" low":""}${i===0?" blk":""}" title="Ответов: ${n}">${g.n}<span class="let">${g.let}</span></th>`}).join("")).join("")}</tr></thead><tbody>`;
  for(const[k,t]of[["spec","Специалист"],["profi","Профи.ру"]]){
    const T=tot[k];
    const gst=blocks.map(b=>b.gs.map(g=>({g,s:st(g.rows,k),r:st(g.rest,k)})));
    const ncol=1+blocks.reduce((a,b)=>a+b.gs.length,0);
    h+=`<tr class="sect"><td><i class="sw" style="background:var(--${k})"></i>${t}</td><td colspan="${ncol}"></td></tr>`;
    for(const m of mets){
      h+=`<tr${m.sub?' class="sub"':""}><td>${m.l}</td><td class="tot">${T.n?m.fmt(m.f(T)):"—"}</td>`;
      gst.forEach(bl=>bl.forEach((x,i)=>{
        const s1=x.s,cls=[i===0?"blk":""];
        if(!s1.n){h+=`<td class="v ${cls.join(" ")}">—</td>`;return}
        if(s1.n<40){h+=`<td class="v lowc ${cls.join(" ")}">${m.fmt(m.f(s1))}</td>`;return}
        if(T.n>=40&&sig(m,s1,T)<.05){const d=m.f(s1)-m.f(T);cls.push(d*m.better>0?"up":"down")}
        let lets="",ln=[];bl.forEach((y,j)=>{if(j===i||y.s.n<40)return;if(m.f(s1)>m.f(y.s)&&sig(m,s1,y.s)<.05){lets+=y.g.let;ln.push(y.g.n+" ("+y.g.let+")")}});
        h+=`<td class="v ${cls.join(" ")}"${ln.length?` title="Значимо выше, чем: ${ln.join(", ")}"`:""}>${m.fmt(m.f(s1))}${lets?`<sup>${lets}</sup>`:""}</td>`;
      }));
      h+=`</tr>`;
    }
    h+=`<tr class="base"><td>База, ответов</td><td class="tot" style="font-weight:500">${T.n}</td>`;
    gst.forEach(bl=>bl.forEach((x,i)=>{h+=`<td class="${i===0?"blk":""}">${x.s.n}${x.s.n&&x.s.n<40?` <span class="warnplate">мало</span>`:""}</td>`}));
    h+=`</tr>`;
    if(S.cmpReasons)h+=reasonRows(k,t,base,blocks,ncol);
  }
  h+=`</tbody></table></div></div></section>`;
  return h;
}

/* ================= профиль фактора: четвёрки против 1–3 (гантели) ================= */
/* Доля фактора с поправкой на число отметок: каждый респондент весит 1 и делит вес поровну между своими отметками.
   Доля = среднее этих весов по ответившим в ветке, сумма по факторам = 100%. Значимость — z-тест скилла CES на средних
   (SE = √(Σ(x−m)²/((n−1)n))), строго p < 0,05, порог 40 в каждой ветке. */
function wstat(rows,k,o){const n=rows.length;if(!n)return{n:0,m:0,se:0,c:0};let c=0;const x=rows.map(r=>{const f=r[k+"F"];if(f.includes(o)){c++;return 1/f.length}return 0});
  const m=x.reduce((a,b)=>a+b,0)/n;const se=n>1?Math.sqrt(x.reduce((a,b)=>a+(b-m)**2,0)/((n-1)*n)):0;return{n,m,se,c}}
function gapData(rows,k,vert){
  const M=rows.filter(r=>r[k+"G"]==="mid"&&r[k+"F"]),N=rows.filter(r=>r[k+"G"]==="neg"&&r[k+"F"]);
  const opts=[...FACT[vert][k].neg,"Другое"];
  const L=opts.map(o=>{const a=wstat(M,k,o),b=wstat(N,k,o);const den=Math.sqrt(a.se**2+b.se**2);
    const ok=a.n>=40&&b.n>=40;const p=ok&&den?pz((b.m-a.m)/den):1;return{o,a,b,d:b.m-a.m,ok,sig:ok&&p<.05}}).filter(x=>x.a.c||x.b.c);
  L.sort((x,y)=>(x.o==="Другое")-(y.o==="Другое")||y.d-x.d);
  return{M,N,L,mx:Math.max(0,...L.map(x=>Math.max(x.a.m,x.b.m)))};
}
function gapPanel(G,k,title,mx){
  const{M,N,L}=G;
  const step=mx>.3?.1:.05;const X=v=>v/mx*100;
  const low=M.length<40||N.length<40;
  let h=`<div class="panel gpanel"><div class="fhead"><h3><i class="sw" style="background:var(--${k})"></i>${title}</h3></div>
  <div class="glg"><span><i style="background:var(--star-4)"></i>4 · чего не хватило <em>база ${M.length}</em></span><span><i style="background:var(--uikit-color-accentRed)"></i>1–3 · что пошло не так <em>база ${N.length}</em></span></div>
  <div class="gnote">${low?`<span class="warnplate">База меньше 40 — разрыв не тестируем</span>`:`<span class="hint">Обе базы от 40 — разрыв тестируем, значимые выделены жирным</span>`}</div>`;
  if(!L.length)return h+`<div class="empty">Нет ответов.</div></div>`;
  let grid="",ax="";for(let t=0;t<=mx+1e-9;t+=step){grid+=`<i style="left:${X(t)}%"></i>`;ax+=`<span style="left:${X(t)}%">${Math.round(t*100)}%</span>`}
  h+=`<div class="gchart"><div class="grow gaxis"><div></div><div class="gtrk">${ax}</div><div></div></div>`;
  for(const x of L){
    const dd=Math.round(x.d*100);const lo=Math.min(x.a.m,x.b.m),hi=Math.max(x.a.m,x.b.m);
    const side=x.d>0?"neg":"mid";
    const vs=!x.ok?"база меньше 40 — не тестируем":x.sig?"разрыв значим (p < 0,05)":"разрыв незначим";
    const tip=`<b>${x.o}</b><br>4 · чего не хватило: ${pct(x.a.m)} · отметили ${x.a.c} из ${x.a.n}<br>1–3 · что пошло не так: ${pct(x.b.m)} · отметили ${x.b.c} из ${x.b.n}<br>Разрыв: ${dd>0?"+":""}${dd} п.п.${dd>0?" в сторону 1–3":dd<0?" в сторону четвёрок":""} · ${vs}`;
    h+=`<div class="grow${x.sig?" gsig":""}${x.o==="Другое"?" gother":""}" data-tip="${escA(tip)}"><div class="glab"><span>${x.o}</span></div><div class="gtrk">${grid}
      <b class="gline ${side}" style="left:${X(lo)}%;width:${X(hi)-X(lo)}%"></b><b class="gdot mid" style="left:${X(x.a.m)}%"></b><b class="gdot neg" style="left:${X(x.b.m)}%"></b></div>
      <div class="gd">${dd>0?"+":""}${dd} п.п.</div></div>`;
  }
  return h+`</div><div class="basen">Сверху — факторы, смещённые в 1–3, снизу — в четвёрки.</div></div>`;
}
const GAPREAD=`<span class="lhelp hl2" tabindex="0">Как читать<i class="q" aria-hidden="true">?</i><span class="tipbox gtip" role="tooltip"><b>Как читать график</b>
Каждая строка — одна причина недовольства. Две точки показывают, как часто её называют в двух группах:
<span class="gex"><span class="gexr"><span class="gexl">Плохо сделал</span><span class="gext"><b class="gline neg" style="left:27%;width:36%"></b><b class="gdot mid" style="left:27%"></b><b class="gdot neg" style="left:63%"></b></span><span class="gexd">+11 п.п.</span></span>
<span class="gexr"><span class="gexl">Цена выросла</span><span class="gext"><b class="gline mid" style="left:20%;width:42%"></b><b class="gdot neg" style="left:20%"></b><b class="gdot mid" style="left:62%"></b></span><span class="gexd">−12 п.п.</span></span></span>
<span class="gli"><i style="background:var(--star-4)"></i>оранжевая — поставили 4 («чего не хватило»)</span>

<span class="gsep"></span>Сверху — самые «критичные» причины, снизу — те, что снижают только до четвёрки. Справа — разрыв между точками; жирным — разница значима. Наведите на строку — покажем точные цифры и базы.</span></span>`;
const GAPHELP=`<span class="lhelp hl2" tabindex="0">Как считаем<i class="q" aria-hidden="true">?</i><span class="tipbox gtip" role="tooltip"><b>Как считаем долю</b>
Недовольные отмечают больше вариантов, чем четвёрки, поэтому обычные проценты у них выше почти по всем факторам. Чтобы сравнение было честным, у каждого человека ровно один голос, и он делится поровну между его отметками.
<span class="ex"><table><tr><td></td><td>Отметки</td><td>Голос на пункт</td></tr><tr><td>Петя</td><td>1 вариант</td><td>1</td></tr><tr><td>Маша</td><td>4 варианта</td><td>0,25</td></tr></table></span>
«Плохо сделал» отметили оба: (1 + 0,25) / 2 = 63%. В сумме по всем факторам в ветке ровно 100% — это доля фактора во всех жалобах ветки.
<span class="gsep"></span>Поэтому цифры здесь не совпадают с «Причинами оценок» выше: там доля людей. Разрыв — разница долей в п.п.; жирным — значим (z-тест, p < 0,05, база от 40 в обеих ветках).</span></span>`;

/* ================= динамика ================= */
function renderDyn(){
  const[P0,P1]=pRange(),P=pLen();const inCur=r=>r.d>=P0&&r.d<=P1,inPrev=r=>r.d>P1&&r.d<=P1+P;
  const D=S.dynDim==="none"?null:DIMS[S.dynDim];
  const all=R.filter(r=>pass(r,["period",...(D?D.skip:[])]));
  let groups=D?D.g():[["Все ответы",()=>true]];
  let h=`<section class="sec"><div class="sechead"><h2>Что изменилось</h2>
  <div class="controls"><label for="ddim">Разбить по</label><select id="ddim"><option value="none" ${S.dynDim==="none"?"selected":""}>Без разбивки</option>${dimOptions(S.dynDim)}</select></div>
  <span class="hint">${fmtD(S.f.period.from)} — ${fmtD(S.f.period.to)} против предыдущих ${P} дн.</span></div>
  ${CLEGEND}`;
  for(const[k,t]of[["spec","Специалист"],["profi","Профи.ру"]]){
    if(D&&D.only&&D.only!==k)continue;
    let gs=groups.map(([n,fn])=>{const g=all.filter(fn);return[n,st(g.filter(inCur),k),st(g.filter(inPrev),k)]});
    if(S.dynDim==="city")gs.sort((a,b)=>b[1].n-a[1].n);
    h+=`<div class="panel" style="padding:0;margin-bottom:16px"><div style="padding:14px 18px 10px"><h3 style="font-size:15px;display:flex;gap:8px;align-items:center"><i class="sw" style="background:var(--${k})"></i>${t}</h3></div>
    <div class="tablewrap"><table class="nw"><thead><tr><th>Группа</th><th>Ответов</th><th>Средний балл</th><th>Изменение</th><th>Top-2</th><th>Изменение</th><th>Bottom-2</th><th>Изменение</th></tr></thead><tbody>`;
    for(const[n,a,b]of gs){
      const low=a.n<40||b.n<40;const ar=`<span class="arrow"> → </span>`;
      h+=`<tr><td><b>${n}</b></td><td>${b.n}${ar}${a.n} ${small(Math.min(a.n,b.n))}</td>
      <td>${b.n?num(b.mean):"—"}${ar}${a.n?num(a.mean):"—"}</td><td>${cell(tmean(a,b),a.mean-b.mean,dm,1,low)}</td>
      <td>${b.n?pct(b.top):"—"}${ar}${a.n?pct(a.top):"—"}</td><td>${cell(zprop(a.tc,a.n,b.tc,b.n),a.top-b.top,pp,1,low)}</td>
      <td>${b.n?pct(b.bot):"—"}${ar}${a.n?pct(a.bot):"—"}</td><td>${cell(zprop(a.bc,a.n,b.bc,b.n),a.bot-b.bot,pp,-1,low)}</td></tr>`;
    }
    h+=`</tbody></table></div></div>`;
  }
  /* тренд */
  const k=D&&D.only?D.only:S.trK,M=S.trM;
  const step=P>180?30:P>45?7:P>14?3:1,nb=Math.max(2,Math.ceil(2*P/step));
  let tg=groups.map(([n,fn])=>[n,all.filter(fn)]);
  if(tg.length>7){tg.sort((a,b)=>b[1].length-a[1].length);tg=tg.slice(0,7)}
  const COLS=D?["var(--uikit-color-textPrimary)","var(--uikit-color-accentRed)","var(--uikit-color-accentBlue)","var(--uikit-color-accentYellow)","var(--uikit-color-accentGreen)","var(--uikit-color-accentPurple)","var(--uikit-color-decorMono2)"]:[`var(--${k})`];
  const lines=tg.map(([n,rows])=>{const pts=[];for(let i=nb-1;i>=0;i--){const s=st(rows.filter(r=>r.d>=P0+i*step&&r.d<P0+(i+1)*step),k);if(s.n)pts.push({i:nb-1-i,n:s.n,v:M==="top"?s.top:M==="bot"?s.bot:s.mean})}return[n,pts]});
  const vals=lines.flatMap(l=>l[1].map(p=>p.v));
  const isM=M==="mean";
  let lo=vals.length?Math.min(...vals):0,hi=vals.length?Math.max(...vals):1;
  if(isM){lo=Math.floor(lo*5)/5;hi=Math.ceil(hi*5)/5}else{lo=Math.max(0,Math.floor(lo*10)/10);hi=Math.min(1,Math.ceil(hi*10)/10)}
  if(hi===lo)hi=lo+(isM?.2:.1);
  const W=760,H=240,pl=44,pr=12,pt=14,pb=30;
  const x=i=>pl+(W-pl-pr)*i/Math.max(nb-1,1),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Тренд">`;
  const gstep=isM?.2:.1;
  for(let g=lo;g<=hi+1e-9;g+=gstep)svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(g)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${isM?g.toFixed(1).replace(".",","):Math.round(g*100)+"%"}</text>`;
  const mid=x((nb-1)/2);
  svg+=`<line x1="${mid}" x2="${mid}" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 4"/><text x="${mid-6}" y="${H-10}" font-size="11" text-anchor="end" fill="var(--muted)">предыдущий период</text><text x="${mid+6}" y="${H-10}" font-size="11" fill="var(--muted)">текущий период</text>`;
  lines.forEach(([n,p],li)=>{const c=COLS[li%COLS.length];
    svg+=`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${p.map(q=>`${x(q.i)},${y(q.v)}`).join(" ")}"/>`;
    svg+=p.map(q=>`<circle cx="${x(q.i)}" cy="${y(q.v)}" r="3.5" fill="${q.n<40?"var(--panel)":c}" stroke="${c}" stroke-width="1.5"><title>${n}: ${isM?num(q.v):pct(q.v)}, ответов: ${q.n}</title></circle>`).join("")});
  svg+=`</svg>`;
  h+=`<section class="sec"><div class="sechead"><h2>Тренд</h2>
  <div class="controls">${D&&D.only?"":`<div class="seg" role="group" aria-label="Оценка">${[["spec","Специалист"],["profi","Профи.ру"]].map(([v,t])=>`<button data-trk="${v}" aria-pressed="${k===v}">${t}</button>`).join("")}</div>`}
  <div class="seg" role="group" aria-label="Метрика">${[["top","Top-2"],["bot","Bottom-2"],["mean","Средний балл"]].map(([v,t])=>`<button data-trm="${v}" aria-pressed="${M===v}">${t}</button>`).join("")}</div></div>
  <span class="hint">Точки по ${step===1?"дням":step===3?"3 дня":step===7?"неделям":"месяцам"}${groups.length>7?", показаны 7 крупнейших групп":""}</span></div>
  <div class="panel chart">${svg}<div class="legend">${lines.map(([n],i)=>`<span><i class="sw" style="background:${COLS[i%COLS.length]}"></i>${n}</span>`).join("")}<span>Полая точка: меньше 40 ответов</span></div></div></section>`;
  return h;
}

  <table class="rdt"><thead><tr><th>Метрика</th><th>Как считаем</th><th>База</th></tr></thead><tbody>
  <tr><td>Средний балл</td><td>Среднее по шкале 1–5</td><td>Все, кто поставил эту оценку</td></tr>

  h+=sec("cmp","7. Лист «Сравнения»",`
  <p>Формат баннерных таблиц: в колонках тотал и группы выбранных разрезов (можно включить несколько разрезов сразу), в строках — средний балл, top-2, bottom-2 и база по каждой шкале; галка добавляет распределение 1–5.</p>
  <p>Ниже каждой шкалы — <b>причины оценок</b> по всем трём вопросам: «Что понравилось?» (оценка 5), «А чего не хватило до пятёрки?» (4) и «Что пошло не так?» (1–3). Доля варианта считается от ответивших на этот вопрос в колонке, база — отдельной строкой под каждым вопросом. Причины по специалисту у вертикалей разные, поэтому они считаются внутри одной вертикали (переключатель над таблицей; в колонке другой вертикали — «—»). Причины по Профи.ру одинаковые и считаются по всем ответам. Для «Что понравилось?» рост доли подсвечивается зелёным, для двух других вопросов — красным. Причины можно скрыть галкой «Причины оценок».</p>
  <ul>

  <li><b>Штриховка.</b> Группа меньше 40 ответов: цифра показана, тест не считается.</li>
  <li>Тотал — все ответы в текущих фильтрах. Группы «Нет данных» в разрезах не показываются, но в тотал входят.</li>

  h+=sec("stat","8. Значимость: методика",`
  <p>Методика взята из скилла CES команды «Путь до заказа» (studio/engine.js, профиль ces_z_frequency_v1) и применяется без весов.</p>
  <ul>
  <li>Стандартная ошибка: SE = √(Σ(x − m)² / ((n − 1) · n)).</li>
  <li>Статистика: z = (m₁ − m₂) / √(SE₁² + SE₂²), двусторонний нормальный тест.</li>
  <li>Доля считается той же формулой — как среднее индикатора 0/1, то есть SE² = p(1 − p) / (n − 1), без объединённой доли.</li>
  <li>Значимо только при p &lt; 0,05. <b>Без поправок</b> на множественные сравнения и <b>без округления</b> до теста: p = 0,051 — не значимо.</li>
  <li>Тест не считается, если в любой из двух групп меньше 40 ответов, или если в обеих группах нет разброса.</li>
  <li>Дашборд сверен с ядром студии: 512 сравнений (пары групп и группы против тотала; средние, баллы, top-2, bottom-2) дали те же выводы, p-value совпадают до седьмого знака.</li>
  </ul>
  <p><b>На что смотреть осторожно.</b> Если в группе 0% или 100% (например, 40 из 40 поставили 4–5), её SE равна нулю, и тест даёт очень сильную значимость. По методике это считается, но такой вывод хрупкий: один новый ответ может его изменить. То же с долями из нескольких человек (например, bottom-2 из 4 ответов). Такие ячейки становятся надёжнее по мере накопления данных.</p>`);

  h+=sec("dyn","9. Лист «Динамика»",`
  <ul>

  <li>Таблицу можно разбить по любому разрезу из листа «Сравнения».</li>

  <ul>
  <li>На отдельном листе «Открытые ответы» 6 блоков: специалист и Профи.ру × ветки 5, 4 и 1–3. В каждом — ответы на «Хотите что-то добавить? ✍️» (поле открывается после «Другое»), свежие сверху. Над блоками — сколько человек выбрали «Другое» и сколько написали текст. Сейчас текстов ${oa}.</li>

  </ul>`);

  h+=sec("camp","11. Лист «Сбор данных»",`
  <p>Служебный лист: ответы и полные анкеты по каждой кампании, первый и последний ответ, а также заполненность атрибутов по кампаниям — видно, где поле не приходит из UXFeedback. Response rate не считаем: в выгрузках нет числа показов опроса.</p>`);

  h+=sec("limits","12. Ограничения данных",`
  <ul>
  <li><b>Веб-кампании после отзыва почти без атрибутов:</b> первый заказ, Стандарт и БС пустые почти у всех ответов, город почти всегда приходит как Москва, у части нет orders_count. Срезы по этим полям фактически строятся на Order closed и приложении. Нужна задача на передачу параметров в review_thanks_page. В приложении после отзыва (review_success) эти поля в основном приходят.</li>
  <li><b>orders_count:</b> 0 при наличии order_id — пропуск данных, а не «ноль заказов». Кроме того, у части клиентов с первым заказом orders_count больше 1: вероятно, счётчик учитывает все заказы клиента, включая более поздние. Выводы по числу заказов стоит перепроверить на внутренних данных.</li>
  <li><b>Малые группы:</b> Стандарт = да и БС = да встречаются единично, репетиторов пока мало.</li>
  <li><b>Нет данных:</b> срок с нами, рейтинг специалиста, выручка, срочность, точка входа, Профи X, «является специалистом», обращения в поддержку, показы опроса.</li>
  <li>В открытых ответах встречается мусор («ааа», «.»); он не фильтруется автоматически.</li>

  return h+`</div></div></section>`;

    parts.push(new Uint8Array(h.buffer),nb,db);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,db.length,true);c.setUint32(24,db.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+db.length}
  const cs=cen.reduce((a,x)=>a+x.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}

   ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
   ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Кейсы" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'Кейсы'!$A$1:$${last.replace(/\d+$/,"")}$${all.length}</definedName></definedNames></workbook>`],
   ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],

  const head=["Статус","Ответственный","Тип кейса","Разрыв (отзыв → опрос)","Дата и время ответа","Текст о специалисте","Текст о Профи.ру","Оценка специалисту","Оценка Профи.ру","Оценка в отзыве","Причины по специалисту","Причины по Профи.ру","order_id","Ссылка на заказ","kk_id","ID ответа","Кампания","Вертикаль","Категория project_id","Платформа","Место показа","Город","Безопасная сделка","Профи Стандарт","Первый заказ","Заказов у клиента"];
  const b=v=>v==null?"":v?"Да":"Нет";
  const data=rows.map(r=>["","",r.ctype==="gap"?"Расхождение с отзывом":"Плохая оценка после закрытия",r.ctype==="gap"?`${r.mark} → ${r.spec}`:"",r.ts,r.specO||"",r.profiO||"",r.spec??"",r.profi??"",r.mark||"",reasons(r,"spec"),reasons(r,"profi"),oidNum(r.oid),oidNum(r.oid)?ORDER_URL+oidNum(r.oid):"",r.kk||"",r.id,r.cid,LBL[r.vert],r.cat||"",r.web?LBL[r.web]:LBL[r.plat],LBL[r.place],r.city||"",b(r.bs),b(r.std),b(r.first),r.ordN??""]);
  const blob=xlsxBlob(head,data,[14,16,26,14,18,60,50,12,12,12,40,40,12,40,12,12,10,12,18,14,14,16,12,12,12,10]);
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="csat_problem_cases_"+DATA.max+".xlsx";document.body.appendChild(a);a.click();a.remove();toast(`Выгружено кейсов: ${data.length}`)}
  catch(e){toast("Браузер не дал скачать файл")}
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2400)}
document.addEventListener("click",e=>{
  const inPop=e.target.closest(".pop");
  const b=e.target.closest("button");
  if(!inPop&&!(b&&b.dataset.pill)&&S.open){S.open=null;renderFbar()}
  if(!b)return;
  if(b.dataset.pill){S.open=S.open===b.dataset.pill?null:b.dataset.pill;renderFbar();return}
  if(b.dataset.fclear){S.f[b.dataset.fclear]=[];if(b.dataset.fclear==="ord"){S.f.ordMin="";S.f.ordMax=""}render();S.open=b.dataset.fclear;renderFbar();return}
  if(b.hasAttribute("data-close")){S.open=null;renderFbar();return}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.open=null;render();return}
  if(b.id==="reset"){S.f=JSON.parse(JSON.stringify(DEF));S.open=null;render();return}
  if(b.dataset.fg){S.fg[b.dataset.fg]=b.dataset.v;render();return}
  if(b.dataset.cdim){const k=b.dataset.cdim;S.cmpDims=S.cmpDims.includes(k)?S.cmpDims.filter(x=>x!==k):[...S.cmpDims,k];render();return}
  if(b.dataset.cv){S.cv=b.dataset.cv;render();return}
  if(b.dataset.fv){S.fv=b.dataset.fv;render();return}
  if(b.dataset.trk){S.trK=b.dataset.trk;render();return}
  if(b.dataset.trm){S.trM=b.dataset.trm;render();return}
  if(b.dataset.preset){const d=+b.dataset.preset;S.f.period={from:iso(d),to:iso(0)};S.open=null;render();return}
  if(b.hasAttribute("data-applydate")){let f=document.getElementById("pfrom").value,t=document.getElementById("pto").value;if(!f||!t){toast("Укажите обе даты");return}if(f>t)[f,t]=[t,f];S.f.period={from:f,to:t};S.open=null;render();return}
  if(b.hasAttribute("data-applyord")){const mn=document.getElementById("omin").value,mx=document.getElementById("omax").value;S.f.ordMin=mn;S.f.ordMax=mx;if(mn!==""||mx!=="")S.f.ord=[];S.open=null;render();return}
  if(b.dataset.export){exportCsv(b.dataset.export);return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.fo){S.f[t.dataset.fo]=t.value;S.open=null;render();return}
  if(t.dataset.fm){const k=t.dataset.fm;if(k==="ord"){S.f.ordMin="";S.f.ordMax=""}S.f[k]=t.checked?[...S.f[k],t.value]:S.f[k].filter(x=>x!==t.value);const o=S.open;render();S.open=o;renderFbar();return}
  if(t.id==="cmpdist"){S.cmpDist=t.checked;render()}
  if(t.id==="cmpreasons"){S.cmpReasons=t.checked;render()}
  if(t.id==="ddim"){S.dynDim=t.value;render()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="fsearch"){const q=e.target.value.toLowerCase();document.querySelectorAll(".pop label[data-name]").forEach(l=>l.style.display=l.dataset.name.includes(q)?"":"none")}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.open){const k=S.open;S.open=null;renderFbar();const p=document.querySelector(`[data-pill="${k}"]`);if(p)p.focus()}});
document.getElementById("upd").innerHTML=`<span class="meta-chip mc2"><span class="mlab">Данные за</span>${DATA.min.split("-").reverse().join(".")} — ${DATA.max.split("-").reverse().join(".")}</span><span class="meta-chip mc2"><span class="mlab">База опроса</span>${R.length.toLocaleString("ru")} ответов · ${new Set(R.map(r=>r.cid)).size} кампаний</span>`;
render();
</script>
